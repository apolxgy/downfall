<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@yourhandle | Profile</title>
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      cursor: default;
    }

    body {
      background: #0a0a0c;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated Background Glows */
    .bg-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      animation: pulse 8s infinite alternate;
    }
    .glow-1 { background: #7928ca; top: 10%; left: 20%; }
    .glow-2 { background: #ff0080; bottom: 10%; right: 20%; }

    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.2) translate(20px, -20px); }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      margin: 1rem;
    }

    /* Avatar Style */
    .avatar-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 1.2rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .status-badge {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      background: #22c55e;
      border: 3px solid #0a0a0c;
      border-radius: 50%;
    }

    /* Profile Info */
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p.bio {
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-top: 0.4rem;
      margin-bottom: 1.5rem;
    }

    /* Links Section */
    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .link-btn i {
      font-size: 1.2rem;
    }

    /* Audio Player */
    .audio-player {
      margin-top: 1.8rem;
      padding: 0.8rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .play-btn {
      background: #fff;
      color: #000;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    .track-info {
      text-align: left;
      flex-grow: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .track-artist {
      font-size: 0.7rem;
      color: #71717a;
    }
  </style>
</head>
<body>

  <!-- Dynamic Glow Backgrounds -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <!-- Profile Card -->
  <div class="card">
    <div class="avatar-container">
      <!-- Replace with your profile image URL -->
      <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar">
      <div class="status-badge" title="Online"></div>
    </div>

    <h1>Your Name</h1>
    <p class="bio">Digital Creator & Developer • Building the future</p>

    <!-- Social Links -->
    <div class="links">
      <a href="https://github.com" target="_blank" class="link-btn">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem; color: #71717a;"></i>
      </a>

      <a href="https://twitter.com" target="_blank" class="link-btn">
        <i class="fa-brands fa-x-twitter"></i>
        <span>Twitter / X</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem; color: #71717a;"></i>
      </a>

      <a href="https://discord.com" target="_blank" class="link-btn">
        <i class="fa-brands fa-discord"></i>
        <span>Discord Server</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem; color: #71717a;"></i>
      </a>

      <a href="https://youtube.com" target="_blank" class="link-btn">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem; color: #71717a;"></i>
      </a>
    </div>

    <!-- Custom Audio Player -->
    <div class="audio-player">
      <button class="play-btn" id="playBtn" onclick="toggleAudio()">
        <i class="fa-solid fa-play" id="playIcon"></i>
      </button>
      <div class="track-info">
        <div class="track-title">Background Track</div>
        <div class="track-artist">Artist Name</div>
      </div>
      <i class="fa-solid fa-music" style="color: #3f3f46; font-size: 0.9rem;"></i>
    </div>

    <!-- Replace 'audio.mp3' with your audio file link -->
    <audio id="bgAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>
  </div>

  <script>
    const audio = document.getElementById('bgAudio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
      } else {
        audio.pause();
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
      }
    }
  </script>
</body>
</html>
